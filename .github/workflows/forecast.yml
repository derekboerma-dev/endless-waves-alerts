name: Endless Waves forecast

on:
  schedule:
    # GitHub start geplande runs vaak uren te laat of helemaal niet. Daarom elk uur een poging; de job
    # 'check' slaat over als de data nog vers genoeg is. Hoofdtrigger: een geplande Claude-taak die om
    # 07:13 en 14:13 (NL) workflow_dispatch start.
    - cron: "17 * * * *"
  workflow_dispatch: {}      # handmatig starten via het tabblad Actions
  push:                      # ook direct draaien na een wijziging in instellingen of scripts
    branches: [main]
    paths: ["config/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: write
  issues: write

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.c.outputs.go }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: data/latest.json
          sparse-checkout-cone-mode: false
      - id: c
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, datetime as dt
          try:
              f = json.load(open("data/latest.json"))["fetched_at"]
              t = dt.datetime.fromisoformat(f.replace("Z", "+00:00"))
              age = (dt.datetime.now(dt.timezone.utc) - t).total_seconds() / 3600
          except Exception:
              age = 99
          now = dt.datetime.now(dt.timezone.utc).hour
          # vers genoeg: jonger dan 6 uur; 's nachts (22-05 UTC) niet draaien
          print("go=" + ("true" if age >= 6 and 5 <= now <= 21 else "false"))
          PY

  run:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Voorspelling ophalen
        run: python scripts/fetch.py

      - name: Sessiescores uit de app ophalen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Sessie in:title" --limit 200 \
            --json number,title,body,createdAt > /tmp/issues.json || echo '[]' > /tmp/issues.json
          python scripts/sessions.py /tmp/issues.json | tee /tmp/sessions.log
          for n in $(tail -n 1 /tmp/sessions.log); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Verwerkt in docs/sessions.json" || true
          done

      - name: Toetsen en reeksen zoeken
        run: python scripts/analyze.py

      - name: Voorspeld tegenover echt (sessies)
        run: python scripts/calibrate.py

      - name: Resultaat vastleggen (ook voor de web-app)
        run: |
          git config user.name "endless-waves-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data out state docs
          git diff --cached --quiet || git commit -m "Voorspelling $(date -u +%F)"
          git pull --rebase origin main
          git push

      - name: Pushmelding naar de app (web push)
        id: webpush
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          WEBPUSH_SUB: ${{ secrets.WEBPUSH_SUB }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$VAPID_PRIVATE_KEY" ] || [ -z "$WEBPUSH_SUB" ] || [ ! -s out/ntfy.txt ]; then echo "geen web push"; exit 0; fi
          pip install --quiet pywebpush
          if python scripts/webpush.py; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "web push mislukt: ntfy als reserve"; fi

      - name: Pushmelding via ntfy (alleen als reserve)
        if: steps.webpush.outputs.ok != 'true'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$NTFY_TOPIC" ] || [ ! -s out/ntfy.txt ]; then echo "geen melding"; exit 0; fi
          python - <<'PY'
          import json, os, urllib.request
          lines = open("out/ntfy.txt", encoding="utf-8").read().splitlines()
          body = {"topic": os.environ["NTFY_TOPIC"], "title": lines[0], "message": "\n".join(lines[1:]),
                  "tags": ["ocean"], "priority": 4}
          if os.environ.get("APP_URL"):
              body["click"] = os.environ["APP_URL"]
          req = urllib.request.Request("https://ntfy.sh", data=json.dumps(body).encode(),
                                       headers={"Content-Type": "application/json"})
          print(urllib.request.urlopen(req, timeout=30).status)
          PY
