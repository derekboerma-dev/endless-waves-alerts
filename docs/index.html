<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Endless Waves</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Endless Waves">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d3b4c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#14232b; --mut:#7a858a; --line:#e6e0d4; --hl:#efe9dc;
  --deep:#0d3b4c; --sea:#127c86;
  /* conditiegraad: slecht · matig · redelijk · goed · top */
  --g0:#d9534f; --g1:#f08a3e; --g2:#f2c14e; --g3:#2fa874; --g4:#1b8fc9; --gna:#d9d3c7;
  --kans:#c58a1b; --waarschijnlijk:#127c86; --bevestigd:#1f9d6b; --vervallen:#c8553d;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1418; --card:#121f25; --ink:#e7eef0; --mut:#8293a0; --line:#22343c; --hl:#172a31;
  --sea:#3bb7c0;
  --g0:#e2675f; --g1:#f39a55; --g2:#f4cc63; --g3:#3cc187; --g4:#3ba9e0; --gna:#2a3b42;
  --kans:#e0a83a; --waarschijnlijk:#3bb7c0; --bevestigd:#2fbf83; --vervallen:#e2765f;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}
.top{background:var(--deep);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 14px;display:flex;align-items:center;gap:10px}
.top h1{margin:0;font:700 20px/1.1 -apple-system,system-ui,sans-serif;letter-spacing:-.2px;flex:1}
.top .upd{font-size:12px;opacity:.7}
.top button{appearance:none;border:0;background:none;color:#fff;font-size:28px;line-height:1;padding:0 6px 0 0;cursor:pointer}
main{padding:12px 0 calc(env(safe-area-inset-bottom) + 24px);max-width:760px;margin:0 auto}
.pad{padding:0 12px}

/* startscherm: Surfline-achtige lijst */
.board{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:100px repeat(16,41px);min-width:max-content}
.grid > *{border-bottom:1px solid var(--line)}
.hd{position:sticky;top:0;background:var(--card);font-size:11px;color:var(--mut);text-align:center;padding:8px 0 6px;line-height:1.2}
.hd b{display:block;color:var(--ink);font-size:13px}
.hd.today b{color:var(--sea)}
.hd.wk{box-shadow:inset 1px 0 0 var(--line)}
.nm{position:sticky;left:0;z-index:1;background:var(--card);padding:0 4px 0 10px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer;box-shadow:1px 0 0 var(--line)}
.nm .al{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:0 3px}
.cell.wk{box-shadow:inset 1px 0 0 var(--line)}
.cell.run{background:var(--hl)}
.cell .h{font-size:14px;font-weight:700;letter-spacing:-.2px}
.cell .h small{font-size:10px;font-weight:500;color:var(--mut)}
.bar{width:31px;height:7px;border-radius:4px;background:var(--gna)}
.bar.g0{--c:var(--g0)}.bar.g1{--c:var(--g1)}.bar.g2{--c:var(--g2)}.bar.g3{--c:var(--g3)}.bar.g4{--c:var(--g4)}
.bar[class*=" g"]{background:var(--c)}
.bar.unsure{background:transparent!important;box-shadow:inset 0 0 0 2px var(--c)}
.cell.na .h{color:var(--mut);font-weight:400}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;font-size:11px;color:var(--mut);margin:12px 12px 0}
.legend i{display:inline-block;width:14px;height:6px;border-radius:3px;vertical-align:1px;margin-right:4px}

/* detail */
.hero{display:flex;align-items:center;gap:10px;margin:4px 14px 12px}
.hero .flag{font-size:24px}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;color:#fff}
.bg-kans{background:var(--kans)}.bg-waarschijnlijk{background:var(--waarschijnlijk)}.bg-bevestigd{background:var(--bevestigd)}.bg-vervallen{background:var(--vervallen)}
.days{display:flex;flex-direction:column;gap:8px;margin:12px 12px 0}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;border-left-width:6px}
.day.focus{outline:2px solid var(--ink)}
.day.g0{border-left-color:var(--g0)}.day.g1{border-left-color:var(--g1)}.day.g2{border-left-color:var(--g2)}.day.g3{border-left-color:var(--g3)}.day.g4{border-left-color:var(--g4)}
.day .l1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.day .l1 b{font-size:16px}
.lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.lbl.g0{color:var(--g0)}.lbl.g1{color:var(--g1)}.lbl.g2{color:var(--g2)}.lbl.g3{color:var(--g3)}.lbl.g4{color:var(--g4)}
.day .big{font-size:22px;font-weight:700;margin-top:4px;letter-spacing:-.3px}
.day .big span{font-size:14px;font-weight:500;color:var(--mut)}
.day .l3{font-size:13px;color:var(--mut);margin-top:2px}
.day .brd{font-size:13px;margin-top:6px}.day .brd b{color:var(--sea)}
.more{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:12px}
.day.open .more{display:block}
.more .m{margin-top:6px}.more .m b{display:block;margin-bottom:2px}
.ok{color:var(--g3);font-weight:700}.no{color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:22px;margin:0 12px;background:var(--card);border:1px solid var(--line);border-radius:14px}
details{margin:14px 12px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--mut)}
summary{cursor:pointer;color:var(--ink);font-weight:600}
.toggle{display:flex;justify-content:flex-end;margin:0 12px 8px}
.toggle button{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font-size:12px;padding:5px 12px;cursor:pointer}
.err{margin:0 12px 10px;padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--vervallen);color:var(--vervallen);font-size:13px}
</style>
</head>
<body>
<div class="top">
  <button id="back" hidden aria-label="Terug">‹</button>
  <h1 id="title">Endless Waves</h1>
  <span class="upd" id="upd"></span>
</div>
<main id="view"></main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FLAG = {NL:'🇳🇱', FR:'🇫🇷', PT:'🇵🇹', MA:'🇲🇦'};
const SHORT = {wijkaanzee:'Wijk a. Zee', vendee:'Bud Bud', crozon:"Lostmarc'h", capferret:'Cap Ferret', biarritz:'Biarritz', peniche:'Peniche', taghazout:'Taghazout'};
const GRADE = ['slecht', 'matig', 'redelijk', 'goed', 'top'];
const WD = ['zo','ma','di','wo','do','vr','za'];
const N = x => x == null ? '–' : Number(x).toFixed(1).replace('.', ',');
const LONG = d => new Date(d + 'T12:00').toLocaleDateString('nl-NL', {weekday:'long', day:'numeric', month:'short'});
let DATA = null;

/* conditiegraad per dag (uit analyze.py): 0 slecht · 1 matig · 2 redelijk · 3 goed · 4 top.
   Onzeker (vaag) als de modellen 2+ graden verschillen, of als de dag op deze termijn niet meetelt. */
const grade = d => d.score ? d.score.v : null;
const unsure = d => !!d.score && (d.score.disagree || (d.score.v >= 3 && !d.counts));
const runDays = g => new Set(g.runs.filter(r => r.qualifies).flatMap(r => r.dates));
const activeRun = g => g.runs.filter(r => r.qualifies).sort((a, b) => a.lead_days - b.lead_days)[0];

function home(){
  $('#back').hidden = true; $('#title').textContent = 'Endless Waves';
  const d0 = DATA.regions[0].days;
  const head = '<div class="hd nm" style="cursor:default"></div>' + d0.map((d, i) => {
    const dt = new Date(d.date + 'T12:00');
    return `<div class="hd ${i ? '' : 'today'} ${i === 7 ? 'wk' : ''}">${WD[dt.getDay()]}<b>${dt.getDate()}</b></div>`; }).join('');
  const rows = DATA.regions.map(g => {
    const a = activeRun(g), rd = runDays(g);
    return `<div class="nm" data-id="${g.id}">${a ? `<i class="al bg-${a.tier}"></i>` : ''}<span>${esc(SHORT[g.id] || g.name)}</span></div>` +
      g.days.map((d, i) => { const gr = grade(d);
        return `<div class="cell ${gr == null ? 'na' : ''} ${rd.has(d.date) ? 'run' : ''} ${i === 7 ? 'wk' : ''}" data-id="${g.id}" data-i="${i}">
          <div class="h">${d.hs != null ? N(d.hs) : '–'}</div>
          <div class="bar ${gr == null ? '' : 'g' + gr} ${unsure(d) ? 'unsure' : ''}"></div></div>`; }).join('');
  }).join('');
  $('#view').innerHTML = `${problems()}
    <div class="board"><div class="scroll"><div class="grid">${head}${rows}</div></div></div>
    <div class="legend">${GRADE.map((t, k) => `<span><i style="background:var(--g${k})"></i>${t}</span>`).join('')}</div>
    <div class="legend">golfhoogte in meter · open balk = onzeker · gemarkeerd = melding</div>`;
  document.querySelectorAll('.nm[data-id], .cell[data-id]').forEach(el => el.addEventListener('click', () => {
    location.hash = el.dataset.id + (el.dataset.i ? '/' + el.dataset.i : '');
  }));
}

function dayCard(d, i){
  const gr = grade(d), b = d.best;
  const models = Object.entries(d.models).map(([lab, m]) => `<div class="m"><b>${lab} · ${GRADE[m.score ?? 0]}${m.strict ? ' ★' : ''}</b>` +
    Object.entries(m.detail).map(([n, s]) => `<div><span class="${s.good ? 'ok' : 'no'}">${s.good ? '✓' : '–'}</span> ${esc(n)} · ${N(s.hs)} m ${s.tp} s ${esc(s.dir)} · wind ${esc(s.wd)} ${s.ws}${s.gu != null ? '/' + s.gu : ''} kn${s.window ? ' · ' + esc(s.window) : ''}</div>`).join('') + '</div>').join('');
  return `<div class="day g${gr ?? 0}" id="d${i}">
    <div class="l1"><b>${LONG(d.date)}</b><span class="lbl g${gr ?? 0}">${gr == null ? 'geen data' : GRADE[gr]}${unsure(d) ? ' ?' : ''}</span></div>
    ${b ? `<div class="big">${N(b.hs)} m <span>${b.tp} s · ${esc(b.dir)}</span></div>
    <div class="l3">${esc(b.spot)} · wind ${esc(b.wd)} ${b.ws} kn${b.window ? ' · ' + esc(b.window) : ''}${d.score?.disagree ? ' · modellen oneens' : ''}</div>` : ''}
    ${d.board ? `<div class="brd">Plank: <b>${esc(d.board)}</b></div>` : ''}
    <div class="more">${models}</div></div>`;
}

function region(id, focus){
  const g = DATA.regions.find(x => x.id === id); if (!g) return home();
  $('#back').hidden = false; $('#title').textContent = SHORT[g.id] || g.name;
  const a = activeRun(g);
  let showAll = focus != null && (grade(g.days[focus]) ?? 0) < 2;
  const a2 = g.alert, req = [a2.mode === 'home' ? `${a2.run_min_days} goede sessie, max ${a2.max_lead_days} d vooruit` : `≥ ${a2.run_min_days} goede dagen op rij`];
  if (a2.min_agree_days) req.push(`modellen eens ≥ ${a2.min_agree_days} d`);
  if (a2.min_strict_days) req.push(`streng ≥ ${a2.min_strict_days} d`);
  if (a2.min_powerful_days) req.push(`krachtig ≥ ${a2.min_powerful_days} d`);
  if (a2.min_strict_or_powerful_days) req.push(`streng of krachtig ≥ ${a2.min_strict_or_powerful_days} d`);
  const draw = () => {
    const list = g.days.map((d, i) => [d, i]).filter(([d]) => showAll || (grade(d) ?? 0) >= 2);
    $('#view').innerHTML = `
      <div class="hero"><span class="flag">${FLAG[g.country] || ''}</span>
        ${a ? `<span class="badge bg-${a.tier}">${a.tier}</span>` : '<span style="color:var(--mut);font-size:13px">geen melding</span>'}</div>
      <div class="toggle"><button id="tg">${showAll ? 'Alleen redelijk en beter' : 'Alle 16 dagen'}</button></div>
      <div class="days">${list.length ? list.map(([d, i]) => dayCard(d, i)).join('') : '<div class="empty">Geen redelijke of betere dagen in de komende 16 dagen.</div>'}</div>
      <details><summary>Spots en meldregels</summary>
        <p>${g.spots.map(s => `${esc(s.name)} <span style="opacity:.7">(${esc(s.src)})</span>`).join('<br>')}</p>
        <p>Melden bij: ${req.join(' · ')}</p>
        <p>Graad: goed = de dag voldoet aan de Endless Waves-definitie; top = ook krachtig of streng goed; redelijk = één voorwaarde net niet; matig/slecht = meerdere niet. Zekerheid melding: bevestigd ≤ 3 dagen · waarschijnlijk 4–7 · kans 8+. Check Surfline voordat je boekt.</p>
      </details>`;
    $('#tg').addEventListener('click', () => { showAll = !showAll; draw(); });
    document.querySelectorAll('.day').forEach(el => el.addEventListener('click', () => el.classList.toggle('open')));
  };
  draw();
  const t = focus != null && document.getElementById('d' + focus);
  if (t){ t.classList.add('focus', 'open'); setTimeout(() => t.scrollIntoView({block:'center'}), 30); } else window.scrollTo(0, 0);
}

const problems = () => DATA.problems?.length ? `<div class="err">Data onvolledig: ${DATA.problems.length} probleem/problemen bij ophalen.</div>` : '';
const route = () => { if (!DATA) return; const [id, i] = location.hash.slice(1).split('/'); id ? region(id, i != null ? +i : null) : home(); };
$('#back').addEventListener('click', () => { location.hash = ''; });
window.addEventListener('hashchange', route);

async function load(){
  try {
    const d = await (await fetch('data.json?t=' + Date.now(), {cache:'no-store'})).json();
    DATA = d;
    const t = d.fetched_at ? new Date(d.fetched_at) : null;
    const old = t && (Date.now() - t) / 36e5 > 36;
    $('#upd').textContent = t ? (old ? '⚠ ' : '') + t.toLocaleTimeString('nl-NL', {hour:'2-digit', minute:'2-digit'}) : '';
    route();
  } catch (e) {
    $('#view').innerHTML = '<div class="empty">Nog geen data. Is de GitHub Action gelopen?</div>';
  }
}
load();
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
