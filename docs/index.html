<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Endless Waves</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Endless Waves">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d3b4c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#14232b; --mut:#7a858a; --line:#e6e0d4; --hl:#efe9dc;
  --deep:#0d3b4c; --sea:#127c86;
  /* conditiegraad: slecht (niets te surfen) · matig · redelijk · goed · top */
  --g0:#c9c3b8; --g1:#f08a3e; --g2:#f2c14e; --g3:#2fa874; --g4:#1b8fc9; --gna:#e4dfd5;
  --kans:#c58a1b; --waarschijnlijk:#127c86; --bevestigd:#1f9d6b; --warn:#c8553d;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1418; --card:#121f25; --ink:#e7eef0; --mut:#8293a0; --line:#22343c; --hl:#172a31;
  --sea:#3bb7c0;
  --g0:#3a4a51; --g1:#f39a55; --g2:#f4cc63; --g3:#3cc187; --g4:#3ba9e0; --gna:#1c2b31;
  --kans:#e0a83a; --waarschijnlijk:#3bb7c0; --bevestigd:#2fbf83; --warn:#e2765f;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}

/* opstartscherm */
#splash{position:fixed;inset:0;z-index:50;background:linear-gradient(#127c86,#0d3b4c 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .45s ease}
#splash.hide{opacity:0;pointer-events:none}
#splash h2{margin:0;font:800 30px/1 -apple-system,system-ui,sans-serif;letter-spacing:-.5px}
#splash p{margin:0;font-size:13px;opacity:.75}
.waves{width:180px;height:60px;overflow:hidden;position:relative}
.waves svg{position:absolute;left:0;width:360px;height:60px;animation:roll 1.6s linear infinite}
.waves svg.b{animation-duration:2.4s;opacity:.5;top:10px}
@keyframes roll{from{transform:translateX(0)}to{transform:translateX(-180px)}}
.sun{width:34px;height:34px;border-radius:50%;background:#f4c96b;box-shadow:0 0 30px #f4c96b88}

/* kopbalk: vast bovenaan */
.top{position:sticky;top:0;z-index:20;background:var(--deep);color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 18px 20px;display:flex;align-items:center;gap:10px}
.top h1{margin:0;font:800 32px/1.1 -apple-system,system-ui,sans-serif;letter-spacing:-.6px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .tt{flex:1;min-width:0}
.top .upd{display:block;font-size:12px;opacity:.75;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .upd.old{color:#f4c96b;opacity:1}
.extra{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.extra .chip{background:transparent;border:1px solid var(--line)}
.top button{appearance:none;border:0;background:none;color:#fff;font-size:36px;line-height:1;padding:0 4px 2px 0;cursor:pointer}
main{padding:12px 0 calc(env(safe-area-inset-bottom) + 84px);max-width:760px;margin:0 auto}
/* menubalk onderin */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 0 calc(env(safe-area-inset-bottom) + 6px)}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut);text-decoration:none;padding:4px 0}
.tabs a svg{width:26px;height:26px}
.tabs a.on{color:var(--sea)}
/* quiver */
.boards{display:flex;flex-direction:column;gap:10px;margin:0 12px}
.board-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start}
.board-card svg{width:64px;height:auto}
.board-card h3{margin:0;font-size:17px}
.board-card .br{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.specs{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:13px;margin-top:8px}
.specs dt{color:var(--mut)} .specs dd{margin:0}
.use{margin-top:8px;font-size:13px;background:var(--hl);border-radius:10px;padding:6px 10px}
.use b{color:var(--sea)}
.qnote{font-size:12px;color:var(--mut);margin:12px 14px 0}

/* startscherm: tegels (variant A) */
:root{--i0:#5f6a70;--i1:#3a2410;--i2:#3a2e0a;--i3:#fff;--i4:#fff}
@media (prefers-color-scheme:dark){:root{--i0:#93a3ab;--i1:#2a1606;--i2:#2a2006;--i3:#06281a;--i4:#04263a}}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.grid{display:grid;grid-template-columns:104px repeat(16,42px);gap:4px;min-width:max-content;padding:0 12px 4px 0;align-items:center}
.hd{font-size:11px;color:var(--mut);text-align:center;padding:4px 0 2px;line-height:1.2}
.hd b{display:block;color:var(--ink);font-size:13px}
.hd.today b{color:var(--sea)}
.sep7{margin-left:6px}
.grp{grid-column:1 / -1;padding:12px 0 0}
.grp span{position:sticky;left:12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.nm{position:sticky;left:0;z-index:1;background:var(--bg);align-self:stretch;padding:0 6px 0 12px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;cursor:pointer;line-height:1.15}
.nm .al{width:7px;height:7px;border-radius:50%;flex:0 0 7px}
.nm span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile{appearance:none;border:0;padding:0;font-family:inherit;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;letter-spacing:-.2px;cursor:pointer;background:var(--c);color:var(--ic)}
.tile.v0{font-weight:500}
.tile.na{background:var(--gna);color:var(--mut);font-weight:400}
.tile.unsure{background:transparent;box-shadow:inset 0 0 0 2px var(--c);color:var(--ink)}
.tile.run{outline:2px solid var(--ink);outline-offset:1px}
.g0{--c:var(--g0);--ic:var(--i0)}.g1{--c:var(--g1);--ic:var(--i1)}.g2{--c:var(--g2);--ic:var(--i2)}.g3{--c:var(--g3);--ic:var(--i3)}.g4{--c:var(--g4);--ic:var(--i4)}
.bar{width:31px;height:7px;border-radius:4px;background:var(--gna)}
.bar[class*=" g"]{background:var(--c)}
.bar.unsure{background:transparent!important;box-shadow:inset 0 0 0 2px var(--c)}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;font-size:11px;color:var(--mut);margin:12px 12px 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}

/* spotdetail */
.sub{display:flex;align-items:center;gap:8px;margin:2px 14px 10px;font-size:13px;color:var(--mut)}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;color:#fff}
.bg-kans{background:var(--kans)}.bg-waarschijnlijk{background:var(--waarschijnlijk)}.bg-bevestigd{background:var(--bevestigd)}
.wave{margin:0 12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px 10px}
.wave .top2{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.wave .best{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--c,var(--mut));text-align:right}
.wave .when2{font-size:12px;color:var(--mut);margin-top:2px;text-align:right}
.wave .meta{font-size:12px;color:var(--mut)}
.bars{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px;align-items:end;height:62px;margin-top:10px}
.bars button{appearance:none;border:0;background:none;padding:0;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;cursor:pointer;color:var(--mut);font:inherit}
.bars button span{font-size:8.5px;letter-spacing:-.3px}
.bars button i{display:block;width:100%;border-radius:3px;background:var(--c,var(--gna))}
.bars button i.unsure{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.bars button.sel i{outline:2px solid var(--ink);outline-offset:1px}
.dates{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px;margin-top:4px;font-size:10px;color:var(--mut);text-align:center}
.dates .t{color:var(--sea);font-weight:700}
@media (prefers-color-scheme:light){.wave .g2 .best{color:#8a6a12}}
.wave .g0 .best{color:var(--mut)}
.days{display:flex;flex-direction:column;gap:8px;margin:12px 12px 0}
.day{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c,var(--line));border-radius:14px;padding:12px 14px;cursor:pointer}
.day.focus{outline:2px solid var(--ink)}
.l1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.l1 b{font-size:16px}
.lbl{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--c)}
.when{margin-top:8px;display:flex;align-items:baseline;gap:8px}
.when .t{font-size:26px;font-weight:800;letter-spacing:-.5px}
.when .k{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:13px;background:var(--hl);border-radius:999px;padding:3px 10px}
.chip.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
.brd{font-size:13px;margin-top:8px}.brd b{color:var(--sea)}
.nogo{font-size:13px;color:var(--mut);margin-top:6px}
.more{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:8px;font-size:12px}
.day.open .more{display:block}
.more .m{margin-top:6px}.more .m b{display:block;margin-bottom:2px}
.ok{color:var(--g3);font-weight:700}.no{color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:22px;margin:0 12px;background:var(--card);border:1px solid var(--line);border-radius:14px}
details{margin:14px 12px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--mut)}
summary{cursor:pointer;color:var(--ink);font-weight:600}
.toggle{display:flex;justify-content:flex-end;margin:10px 12px 0}
.toggle button{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font-size:12px;padding:5px 12px;cursor:pointer}
.top .icon{appearance:none;border:0;background:none;color:#fff;font-size:28px;line-height:1;padding:0 2px;cursor:pointer}
.top .icon.on{color:#f4c96b}
.actions{display:flex;gap:8px;margin:12px 12px 0}
.actions a,.actions button{flex:1;appearance:none;text-align:center;text-decoration:none;font-size:14px;font-weight:600;padding:11px 8px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.actions .pri{background:var(--sea);border-color:var(--sea);color:#fff}
.sess{margin:12px 12px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.sess h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.sess .r{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.sess .r:first-of-type{border-top:0}
.sess .r .lbl{min-width:64px}
.sheet-bg{position:fixed;inset:0;z-index:60;background:#0008;display:flex;align-items:flex-end}
.sheet{background:var(--card);width:100%;max-width:760px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
.sheet h3{margin:0 0 10px;font-size:18px}
.sheet label{display:block;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:7px 12px;font-size:14px;cursor:pointer}
.seg button.on{border-color:var(--ink);font-weight:700;box-shadow:inset 0 -4px 0 var(--c,var(--sea))}
.sheet textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;background:var(--bg);color:var(--ink)}
.sheet .hint{font-size:12px;color:var(--mut);margin-top:8px}
.err{margin:0 12px 10px;padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--warn);color:var(--warn);font-size:13px}
</style>
</head>
<body>
<div id="splash">
  <div class="sun"></div>
  <div class="waves">
    <svg viewBox="0 0 360 60" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"><path d="M0 30c22 0 22-18 45-18s23 18 45 18 22-18 45-18 23 18 45 18 22-18 45-18 23 18 45 18 22-18 45-18 23 18 45 18"/></svg>
    <svg class="b" viewBox="0 0 360 60" fill="none" stroke="#d8efe9" stroke-width="4" stroke-linecap="round"><path d="M0 36c22 0 22-12 45-12s23 12 45 12 22-12 45-12 23 12 45 12 22-12 45-12 23 12 45 12 22-12 45-12 23 12 45 12"/></svg>
  </div>
  <h2>Endless Waves</h2>
  <p id="splashmsg">Voorspelling laden…</p>
</div>
<div class="top">
  <button id="back" hidden aria-label="Terug">‹</button>
  <div class="tt"><h1 id="title">Endless Waves</h1><span class="upd" id="upd"></span></div>
  <button id="fav" class="icon" hidden aria-label="Favoriet">☆</button>
</div>
<main id="view"></main>
<nav class="tabs">
  <a href="#" id="tab-f"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 14c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3 2.5 3 5 3"/><path d="M2 19c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3 2.5 3 5 3"/><circle cx="17" cy="6" r="2.5"/></svg>Voorspelling</a>
  <a href="#quiver" id="tab-q"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2c3 3 4.5 8 4.5 12.5 0 3.5-1.5 6-4.5 7.5-3-1.5-4.5-4-4.5-7.5C7.5 10 9 5 12 2z"/><path d="M12 6v12"/></svg>Quiver</a>
</nav>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const FLAG = {NL:'🇳🇱', FR:'🇫🇷', PT:'🇵🇹', MA:'🇲🇦'};
const GRADE = ['slecht', 'matig', 'redelijk', 'goed', 'top'];
const WD = ['zo','ma','di','wo','do','vr','za'];
const N = x => x == null ? '–' : Number(x).toFixed(1).replace('.', ',');
const LONG = d => new Date(d + 'T12:00').toLocaleDateString('nl-NL', {weekday:'long', day:'numeric', month:'short'});
let DATA = null;

const g = d => d.v == null ? 'na' : 'g' + d.v;
const runDates = s => new Set(s.run ? s.run.dates : []);

/* favorieten: per toestel bewaard (localStorage), met try/catch voor privé-modus */
const favs = () => { try { return JSON.parse(localStorage.getItem('ew-fav') || '[]'); } catch(e){ return []; } };
const setFavs = a => { try { localStorage.setItem('ew-fav', JSON.stringify(a)); } catch(e){} };

function home(){
  $('#back').hidden = true; $('#fav').hidden = true; $('#title').textContent = 'Endless Waves';
  const days = DATA.spots[0].days;
  let html = '<div class="hd nm" style="cursor:default"></div>' + days.map((d, i) => {
    const dt = new Date(d.date + 'T12:00');
    return `<div class="hd ${i ? '' : 'today'}">${WD[dt.getDay()]}<b>${dt.getDate()}</b></div>`; }).join('');
  const F = favs();
  const groups = (F.length ? ['★ Favorieten'] : []).concat(DATA.groups || [...new Set(DATA.spots.map(s => s.group))]);
  groups.forEach(grp => {
    const list = DATA.spots.map((s, k) => [s, k]).filter(([s]) => grp === '★ Favorieten' ? F.includes(s.name) : (s.group === grp && !F.includes(s.name)));
    if (!list.length) return;
    html += `<div class="grp"><span>${grp === '★ Favorieten' ? '' : (FLAG[list[0][0].country] || '')} ${esc(grp)}</span></div>`;
    list.forEach(([s, k]) => {
      const rd = runDates(s);
      html += `<div class="nm" data-k="${k}">${s.run ? `<i class="al bg-${s.run.tier}"></i>` : ''}<span>${esc(s.name)}</span></div>` +
        s.days.map((d, i) => `<button class="tile ${d.v == null ? 'na' : 'g' + d.v + ' v' + d.v} ${d.unsure ? 'unsure' : ''} ${rd.has(d.date) ? 'run' : ''}" data-k="${k}" data-i="${i}" aria-label="${esc(s.name)} ${esc(d.date)}">${N(d.hs)}</button>`).join('');
    });
  });
  $('#view').innerHTML = `${problems()}<div class="scroll"><div class="grid">${html}</div></div>
    <div class="legend">${GRADE.map((t, k) => `<span><i style="background:var(--g${k})"></i>${k ? t : 'niets'}</span>`).join('')}</div>
    <div class="legend">golfhoogte in meter · open tegel = onzeker · omlijnd = melding</div>`;
  document.querySelectorAll('[data-k]').forEach(el => el.addEventListener('click', () => {
    location.hash = 's' + el.dataset.k + (el.dataset.i ? '/' + el.dataset.i : '');
  }));
}

function extras(d){
  const c = [];
  if (d.sst != null) c.push(`<span class="chip">🌡 water ${N(d.sst)}°${d.air != null ? ` · lucht ${d.air}°` : ''}</span>`);
  if (d.wetsuit) c.push(`<span class="chip">wetsuit: ${esc(d.wetsuit)}</span>`);
  if (d.sun) c.push(`<span class="chip">☀ ${d.sun[0]}–${d.sun[1]}</span>`);
  return c.length ? `<div class="extra">${c.join('')}</div>` : '';
}
function tideChips(d, s){
  const t = (d.tides || []).map(x => `${x.k === 'HW' ? 'hoog' : 'laag'} ≈${x.t}`);
  return t.length ? `<span class="chip">🌊 ${t.join(' · ')}</span>` : '';
}

function dayCard(s, d, i){
  const p = d.plan, gr = d.v ?? 0;
  const models = Object.entries(d.models).map(([lab, e]) => `<div class="m"><b>${lab} · ${GRADE[e.score ?? 0]}${e.strict ? ' ★' : ''}</b>
      ${N(e.hs)} m · ${e.tp} s · ${esc(e.dir)} · wind ${esc(e.wd)} ${e.ws}${e.gu != null ? '/' + e.gu : ''} kn${e.window ? ' · ochtend ' + esc(e.window) : ''}</div>`).join('');
  return `<div class="day g${gr}" id="d${i}">
    <div class="l1"><b>${LONG(d.date)}</b><span class="lbl">${gr ? GRADE[gr] : 'niets te surfen'}${d.unsure ? ' ?' : ''}</span></div>
    ${p ? `<div class="when"><span class="k">beste tijd</span><span class="t">${esc(p.window)}</span></div>
      <div class="facts"><span class="chip">${N(p.hs)} m · ${p.tp} s · ${esc(p.dir)}</span><span class="chip">wind ${esc(p.wd)} ${p.ws} kn</span>
      ${p.tide ? `<span class="chip ${p.tide_ok ? '' : 'warn'}">${esc(p.tide)}${p.tide_ok ? '' : ' (niet ideaal)'}</span>` : ''}${tideChips(d, s)}</div>
      ${p.board ? `<div class="brd">Plank: <b>${esc(p.board)}</b></div>` : ''}${extras(d)}`
    : `<div class="nogo">Geen uur waarin swell, periode, hoogte en wind samen kloppen.</div><div class="facts">${tideChips(d, s)}</div>${extras(d)}`}
    ${d.disagree ? '<div class="nogo">ECMWF en GFS verschillen sterk: onzeker.</div>' : ''}
    <div class="more">${models}</div></div>`;
}

/* spotkaart (variant B): staafje per dag, hoogte = golfhoogte, kleur = conditie */
function waveCard(s, sel){
  let bi = 0; s.days.forEach((d, i) => { if ((d.v ?? -1) > (s.days[bi].v ?? -1)) bi = i; });
  const b = s.days[bi], bv = b.v ?? 0;
  const bestLbl = bv ? `${GRADE[bv]} · ${N(b.hs)} m` : 'niets in zicht';
  const when = bv ? `${new Date(b.date + 'T12:00').toLocaleDateString('nl-NL', {weekday:'short', day:'numeric'})}${b.plan ? ' · ' + b.plan.window : ''}` : '16 dagen';
  const maxH = Math.max(2.5, ...s.days.map(d => Math.min(d.hs || 0, 4)));
  const bars = s.days.map((d, i) => `<button class="${d.v == null ? '' : 'g' + d.v} ${sel === i ? 'sel' : ''}" data-i="${i}" aria-label="${esc(d.date)}">
      <span>${d.hs != null ? N(d.hs) : ''}</span><i class="${d.unsure ? 'unsure' : ''}" style="height:${Math.max(4, Math.min(d.hs || 0, 4) / maxH * 40)}px"></i></button>`).join('');
  const dates = s.days.map((d, i) => `<span class="${i ? '' : 't'}">${new Date(d.date + 'T12:00').getDate()}</span>`).join('');
  return `<div class="wave">
    <div class="top2"><div class="meta">${FLAG[s.country] || ''} ${esc(s.group)}${s.run ? ` · <span class="badge bg-${s.run.tier}">${s.run.tier}</span>` : ''}${s.days[0].sst != null ? `<br>water ${N(s.days[0].sst)}° · ${esc(s.days[0].wetsuit)}` : ''}</div>
      <div class="g${bv}"><div class="best">${bestLbl}</div><div class="when2">${esc(when)}</div></div></div>
    <div class="bars">${bars}</div><div class="dates">${dates}</div></div>`;
}

function spot(k, focus){
  const s = DATA.spots[k]; if (!s) return home();
  $('#back').hidden = false; $('#title').textContent = s.name;
  const fb = $('#fav'); fb.hidden = false;
  const paintFav = () => { const on = favs().includes(s.name); fb.textContent = on ? '★' : '☆'; fb.classList.toggle('on', on); };
  paintFav();
  fb.onclick = () => { const F = favs(); setFavs(F.includes(s.name) ? F.filter(x => x !== s.name) : F.concat(s.name)); paintFav(); };
  const slUrl = s.surfline_id ? `https://www.surfline.com/surf-report/x/${s.surfline_id}`
    : `https://www.surfline.com/surf-reports-forecasts-cams-map/@${s.lat},${s.lon},13z`;
  let showAll = focus != null && (s.days[focus].v ?? 0) < 2;
  const reg = DATA.regions.find(r => r.id === s.region), a2 = reg.alert;
  const req = [a2.mode === 'home' ? `${a2.run_min_days} goede sessie, max ${a2.max_lead_days} d vooruit` : `≥ ${a2.run_min_days} goede dagen op rij`];
  if (a2.min_agree_days) req.push(`modellen eens ≥ ${a2.min_agree_days} d`);
  if (a2.min_strict_days) req.push(`streng ≥ ${a2.min_strict_days} d`);
  if (a2.min_powerful_days) req.push(`krachtig ≥ ${a2.min_powerful_days} d`);
  if (a2.min_strict_or_powerful_days) req.push(`streng of krachtig ≥ ${a2.min_strict_or_powerful_days} d`);
  const draw = sel => {
    const list = s.days.map((d, i) => [d, i]).filter(([d]) => showAll || (d.v ?? 0) >= 2);
    $('#view').innerHTML = `
      ${waveCard(s, sel)}
      <div class="actions"><a href="${slUrl}" target="_blank" rel="noopener">Open in Surfline ↗</a><button class="pri" id="rate">Sessie beoordelen</button></div>
      ${sessionsBlock(s)}
      <div class="toggle"><button id="tg">${showAll ? 'Alleen aanraders' : 'Alle 16 dagen'}</button></div>
      <div class="days">${list.length ? list.map(([d, i]) => dayCard(s, d, i)).join('') : '<div class="empty">Geen aanraders in de komende 16 dagen.</div>'}</div>
      <details><summary>Over deze spot</summary>
        <p>Werkt bij Hs ${N(s.hs_range[0])}–${N(s.hs_range[1])} m · getij: ${esc(s.tide_pref)} · bron criteria: ${esc(s.src)}</p>
        <p>Melding (regio ${esc(s.region_name)}): ${req.join(' · ')}</p>
        <p>"Beste tijd" = het blok van 1–3 daglichturen waarin swellrichting, periode, golfhoogte en wind kloppen, met voorkeur voor het juiste getij, zwakke offshore wind en lange periode. Getij en golven zijn modelwaarden; check Surfline voordat je gaat.</p>
      </details>`;
    $('#tg').addEventListener('click', () => { showAll = !showAll; draw(sel); });
    $('#rate').addEventListener('click', () => rateSheet(s));
    document.querySelectorAll('.day').forEach(el => el.addEventListener('click', () => el.classList.toggle('open')));
    document.querySelectorAll('.bars button').forEach(el => el.addEventListener('click', () => {
      const i = +el.dataset.i; if (!document.getElementById('d' + i)) showAll = true; draw(i); focusDay(i);
    }));
  };
  const focusDay = i => { const t = document.getElementById('d' + i); if (t){ t.classList.add('focus', 'open'); setTimeout(() => t.scrollIntoView({block:'center', behavior:'smooth'}), 30); } };
  draw(focus);
  if (focus != null) focusDay(focus); else window.scrollTo(0, 0);
}

/* ---------- sessiescores: via een GitHub-issue naar de repository (zodat Claude ze kan gebruiken) ---------- */
let SESS = [];
const localSess = () => { try { return JSON.parse(localStorage.getItem('ew-sess') || '[]'); } catch(e){ return []; } };
let CAL = {};
function sessionsBlock(s){
  const cal = CAL[s.name];
  const calBy = Object.fromEntries((cal?.sessions || []).map(r => [r.date + '|' + (r.time || '') + '|' + r.score, r]));
  const synced = SESS.filter(r => r.spot === s.name).map(r => ({...r, cal: calBy[r.date + '|' + (r.time || '') + '|' + r.score]}));
  const keys = new Set(synced.map(r => r.date + r.score));
  const pending = localSess().filter(r => r.spot === s.name && !keys.has(r.date + r.score)).map(r => ({...r, pending:true}));
  const all = pending.concat(synced).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 6);
  if (!all.length) return '';
  const sum = cal && cal.n_compared ? `<div style="font-size:13px;margin:-2px 0 6px">${cal.n_compared} vergeleken · gemiddeld ${cal.mean_diff > 0 ? '+' : ''}${N(cal.mean_diff)} graad t.o.v. de voorspelling${cal.hints.length ? '' : ' · nog te weinig voor conclusies'}</div>${cal.hints.map(h => `<div class="nogo" style="margin:0 0 4px">→ ${esc(h)}</div>`).join('')}` : '';
  return `<div class="sess"><h4>Jouw sessies</h4>${sum}${all.map(r => { const c = r.cal?.cond;
    const pred = r.cal && r.cal.predicted != null ? `voorspeld: ${GRADE[r.cal.predicted]}` : (r.forecast ? `voorspeld: ${esc(r.forecast)}` : '');
    return `<div class="r g${r.score}"><span class="lbl">${GRADE[r.score]}</span>
    <span>${LONG(r.date)}${r.time ? ' · ' + esc(r.time) : ''}${r.board ? ' · ' + esc(r.board) : ''}${r.note ? ' · ' + esc(r.note) : ''}
    ${pred || c ? `<br><span style="color:var(--mut)">${pred}${c ? ` · ${N(c.hs)} m ${c.tp} s ${esc(c.dir)} · wind ${esc(c.wd)} ${c.ws} kn${c.tide ? ' · ' + esc(c.tide) : ''}` : ''}</span>` : ''}${r.pending ? ' <span style="color:var(--mut)">(nog niet verwerkt)</span>' : ''}</span></div>`; }).join('')}</div>`;
}
function rateSheet(s){
  const iso = n => { const d = new Date(); d.setDate(d.getDate() - n); return d.toLocaleDateString('sv-SE'); };
  const dates = [0, 1, 2, 3].map(n => [iso(n), n === 0 ? 'vandaag' : n === 1 ? 'gisteren' : LONG(iso(n))]);
  const boards = (QUIVER?.boards || []).map(b => b.short || `${b.brand} ${b.length}`);
  let st = {date: dates[0][0], time: '', score: null, board: '', note: ''};
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  const paint = () => {
    const fc = s.days.find(d => d.date === st.date);
    bg.innerHTML = `<div class="sheet"><h3>Sessie ${esc(s.name)}</h3>
      <label>Wanneer</label><div class="seg" id="sd">${dates.map(([v, t]) => `<button data-v="${v}" class="${st.date === v ? 'on' : ''}">${t}</button>`).join('')}</div>
      <label>Hoe laat?</label><div class="seg" id="st">${['ochtend', 'middag', 'avond'].map(t => `<button data-v="${t}" class="${st.time === t ? 'on' : ''}">${t}</button>`).join('')}<input id="sh" type="time" value="${/^\d/.test(st.time) ? st.time : ''}" aria-label="Begintijd" style="border:1px solid var(--line);border-radius:999px;padding:6px 10px;font:inherit;background:var(--bg);color:var(--ink)"></div>
      <label>Hoe was het?</label><div class="seg" id="ss">${GRADE.map((t, k) => `<button data-v="${k}" class="g${k} ${st.score === k ? 'on' : ''}">${k ? t : 'niets'}</button>`).join('')}</div>
      <label>Plank</label><div class="seg" id="sb">${boards.map(b => `<button data-v="${esc(b)}" class="${st.board === b ? 'on' : ''}">${esc(b)}</button>`).join('')}</div>
      <label>Opmerking</label><textarea id="sn" placeholder="bijv. te vol bij hoogwater, mooie linkers">${esc(st.note)}</textarea>
      <div class="actions" style="margin:14px 0 0"><button id="sc">Annuleren</button><button class="pri" id="sk" ${st.score == null ? 'disabled style="opacity:.5"' : ''}>Versturen</button></div>
      <div class="hint">Versturen opent GitHub met een ingevuld formulier: tik daar op "Submit new issue". De volgende run verwerkt je score${fc ? ' samen met de voorspelling van die dag' : ''}.</div></div>`;
    bg.querySelectorAll('#sd button').forEach(b => b.onclick = () => { st.date = b.dataset.v; paint(); });
    bg.querySelectorAll('#ss button').forEach(b => b.onclick = () => { st.score = +b.dataset.v; paint(); });
    bg.querySelectorAll('#st button').forEach(b => b.onclick = () => { st.time = st.time === b.dataset.v ? '' : b.dataset.v; paint(); });
    bg.querySelector('#sh').onchange = e => { st.time = e.target.value; paint(); };
    bg.querySelectorAll('#sb button').forEach(b => b.onclick = () => { st.board = st.board === b.dataset.v ? '' : b.dataset.v; paint(); });
    bg.querySelector('#sn').oninput = e => { st.note = e.target.value; };
    bg.querySelector('#sc').onclick = () => bg.remove();
    bg.querySelector('#sk').onclick = () => {
      if (st.score == null) return;
      const fcs = fc ? `${GRADE[fc.v ?? 0]}, ${N(fc.hs)} m${fc.plan ? `, beste tijd ${fc.plan.window}` : ''}` : 'niet meer in de app';
      const body = `Spot: ${s.name}\nDatum: ${st.date}\nTijd: ${st.time}\nScore: ${st.score} (${GRADE[st.score]})\nPlank: ${st.board}\nOpmerking: ${st.note.replace(/\n/g, ' ')}\nVoorspeld: ${fcs}\n\n(ingediend vanuit de Endless Waves-app)`;
      const url = `https://github.com/${DATA.repo}/issues/new?title=${encodeURIComponent('Sessie: ' + s.name + ' ' + st.date)}&body=${encodeURIComponent(body)}`;
      try { const L = localSess(); L.unshift({spot: s.name, date: st.date, time: st.time, score: st.score, board: st.board, note: st.note, forecast: fcs}); localStorage.setItem('ew-sess', JSON.stringify(L.slice(0, 100))); } catch(e){}
      window.open(url, '_blank'); bg.remove(); route();
    };
  };
  paint(); bg.addEventListener('click', e => { if (e.target === bg) bg.remove(); });
  document.body.appendChild(bg);
}

const problems = () => DATA.problems?.length ? `<div class="err">Data onvolledig: ${DATA.problems.length} probleem/problemen bij ophalen.</div>` : '';
const route = () => { const h = location.hash.slice(1);
  $('#tab-q').classList.toggle('on', h === 'quiver'); $('#tab-f').classList.toggle('on', h !== 'quiver');
  if (h === 'quiver') return quiver();
  if (!DATA) return; if (h.startsWith('s')){ const [k, i] = h.slice(1).split('/'); spot(+k, i != null ? +i : null); } else home(); };

/* ---------- quiver: getekende silhouetten op basis van lengte, breedte en tailvorm ---------- */
let QUIVER = null;
function boardSVG(b){
  const L = b.len_in || 72, W = b.w_in || 19.5, s = 3.2;            // px per inch
  const h = L * s, w = W * s, cx = 40, top = 6;
  const noseW = (b.nose_in || W * 0.62) * s / 2, tailW = (b.tail_in || W * 0.7) * s / 2, half = w / 2;
  const y = f => top + f * h;
  const wide = y(0.52);
  let tail;
  switch (b.tail){
    case 'pintail':   tail = `C ${cx + tailW * 0.9} ${y(0.86)} ${cx + 6} ${y(0.97)} ${cx} ${y(1)} C ${cx - 6} ${y(0.97)} ${cx - tailW * 0.9} ${y(0.86)}`; break;
    case 'round':     tail = `C ${cx + tailW * 1.05} ${y(0.93)} ${cx + tailW * 0.7} ${y(1)} ${cx} ${y(1)} C ${cx - tailW * 0.7} ${y(1)} ${cx - tailW * 1.05} ${y(0.93)}`; break;
    case 'roundpin':  tail = `C ${cx + tailW} ${y(0.9)} ${cx + 10} ${y(1)} ${cx} ${y(1)} C ${cx - 10} ${y(1)} ${cx - tailW} ${y(0.9)}`; break;
    case 'swallow':   tail = `C ${cx + tailW} ${y(0.9)} ${cx + tailW * 0.75} ${y(0.98)} ${cx + tailW * 0.6} ${y(1)} L ${cx} ${y(0.955)} L ${cx - tailW * 0.6} ${y(1)} C ${cx - tailW * 0.75} ${y(0.98)} ${cx - tailW} ${y(0.9)}`; break;
    case 'squash-wide': tail = `C ${cx + tailW * 1.05} ${y(0.92)} ${cx + tailW * 0.75} ${y(1)} ${cx + tailW * 0.6} ${y(1)} L ${cx - tailW * 0.6} ${y(1)} C ${cx - tailW * 0.75} ${y(1)} ${cx - tailW * 1.05} ${y(0.92)}`; break;
    default:          tail = `C ${cx + tailW} ${y(0.92)} ${cx + tailW * 0.6} ${y(1)} ${cx + tailW * 0.45} ${y(1)} L ${cx - tailW * 0.45} ${y(1)} C ${cx - tailW * 0.6} ${y(1)} ${cx - tailW} ${y(0.92)}`;
  }
  const d = `M ${cx} ${y(0)} C ${cx + noseW * 0.6} ${y(0.02)} ${cx + noseW} ${y(0.12)} ${cx + half * 0.92} ${y(0.3)}
    C ${cx + half} ${y(0.42)} ${cx + half} ${y(0.6)} ${cx + tailW * 1.15} ${y(0.8)} ${tail} ${cx - tailW * 1.15} ${y(0.8)}
    C ${cx - half} ${y(0.6)} ${cx - half} ${y(0.42)} ${cx - half * 0.92} ${y(0.3)} C ${cx - noseW} ${y(0.12)} ${cx - noseW * 0.6} ${y(0.02)} ${cx} ${y(0)} Z`;
  const fins = (b.fins || '').includes('5-fin') ? 5 : 3, fy = y(0.9);
  const finEls = [[0, 0], [-tailW * 0.55, -10], [tailW * 0.55, -10]].concat(fins === 5 ? [[-tailW * 0.35, 2], [tailW * 0.35, 2]] : [])
    .slice(0, fins === 5 ? 5 : 3).map(([dx, dy]) => `<rect x="${cx + dx - 1.5}" y="${fy + dy}" width="3" height="9" rx="1.5" fill="currentColor" opacity=".35"/>`).join('');
  return `<svg viewBox="0 0 80 ${h + 12}" style="color:var(--ink)"><path d="${d}" fill="var(--hl)" stroke="currentColor" stroke-width="1.6"/>
    <line x1="${cx}" y1="${y(0.03)}" x2="${cx}" y2="${y(0.97)}" stroke="currentColor" stroke-width=".7" opacity=".35"/>${finEls}</svg>`;
}
async function quiver(){
  $('#back').hidden = true; $('#fav').hidden = true; $('#title').textContent = 'Quiver';
  if (!QUIVER){ try { QUIVER = await (await fetch('quiver.json?t=' + Date.now(), {cache:'no-store'})).json(); } catch(e){ $('#view').innerHTML = '<div class="empty">Quiver niet gevonden.</div>'; return; } }
  const row = (k, v) => v ? `<dt>${k}</dt><dd>${esc(v)}</dd>` : '';
  $('#view').innerHTML = `<div class="boards">${QUIVER.boards.map(b => `<div class="board-card">${boardSVG(b)}
      <div><div class="br">${esc(b.brand)}</div><h3>${esc(b.length)} ${esc(b.name)}</h3>
      <dl class="specs">${row('Maten', [b.length, b.width, b.thick].filter(Boolean).join(' × '))}${row('Volume', b.volume)}${row('Tail', ({swallow:'swallow', 'squash-wide':'brede squash', pintail:'pintail', round:'round tail', squash:'squash', roundpin:'roundpin (aanname)'})[b.tail])}${row('Vinnen', b.fins)}${row('Herkomst', b.origin)}</dl>
      <div class="use">Pak deze bij <b>${esc(b.use)}</b></div>
      ${b.note ? `<div class="qnote" style="margin:6px 0 0">${esc(b.note)}</div>` : ''}</div></div>`).join('')}</div>
    ${QUIVER._note ? `<p class="qnote"><b>Ontbreekt:</b> ${esc(QUIVER._note.replace('Een echte step-up', 'een echte step-up'))}</p>` : ''}
    <p class="qnote">De silhouetten zijn getekend uit lengte, breedte en tailvorm. Eigen foto's toevoegen kan: zet ze in docs/img/ en geef ze door, dan koppel ik ze.</p>`;
  window.scrollTo(0, 0);
}
$('#back').addEventListener('click', () => { location.hash = ''; });
$('#tab-f').addEventListener('click', e => { e.preventDefault(); location.hash = ''; route(); });
window.addEventListener('hashchange', route);

async function load(first){
  const t0 = Date.now();
  try {
    const d = await (await fetch('data.json?t=' + Date.now(), {cache:'no-store'})).json();
    if (!d.spots || !d.spots.length) throw new Error('oude data');
    DATA = d;
    try { SESS = await (await fetch('sessions.json?t=' + Date.now(), {cache:'no-store'})).json(); } catch(e){ SESS = []; }
    try { CAL = await (await fetch('calibration.json?t=' + Date.now(), {cache:'no-store'})).json(); } catch(e){ CAL = {}; }
    if (!QUIVER){ try { QUIVER = await (await fetch('quiver.json', {cache:'no-store'})).json(); } catch(e){} }
    const t = d.fetched_at ? new Date(d.fetched_at) : null;
    const old = t && (Date.now() - t) / 36e5 > 36;
    $('#upd').textContent = t ? (old ? '⚠ Data verouderd · ' : 'Data bijgewerkt ') + t.toLocaleDateString('nl-NL', {weekday:'short', day:'numeric', month:'short'}) + ', ' + t.toLocaleTimeString('nl-NL', {hour:'2-digit', minute:'2-digit'}) : '';
    $('#upd').classList.toggle('old', !!old);
    route();
  } catch (e) {
    $('#view').innerHTML = '<div class="empty" style="margin-top:12px">Nog geen (nieuwe) data. De volgende run van de GitHub Action vult dit.</div>';
  }
  if (first) setTimeout(() => $('#splash').classList.add('hide'), Math.max(0, 3000 - (Date.now() - t0)));
}
load(true);
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(false); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
